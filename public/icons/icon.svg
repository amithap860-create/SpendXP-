<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: dark navy -->
  <rect width="512" height="512" rx="96" fill="#1A1F2E"/>
  <!-- SpendXP logo mark: scales of balance -->
  <!-- Central pole -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="#4EA07A" stroke-width="20" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="160" y1="416" x2="352" y2="416" stroke="#4EA07A" stroke-width="20" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="144" y1="200" x2="368" y2="200" stroke="#4EA07A" stroke-width="18" stroke-linecap="round"/>
  <!-- Left scale pan -->
  <path d="M144 200 L104 292 Q144 320 184 292 Z" stroke="#4EA07A" stroke-width="14" stroke-linejoin="round" fill="none"/>
  <!-- Right scale pan -->
  <path d="M368 200 L328 292 Q368 320 408 292 Z" stroke="#4EA07A" stroke-width="14" stroke-linejoin="round" fill="none"/>
  <!-- XP text -->
  <text x="256" y="490" font-family="Arial Black, sans-serif" font-weight="900" font-size="56" fill="#4EA07A" text-anchor="middle" letter-spacing="-2">XP</text>
</svg>
