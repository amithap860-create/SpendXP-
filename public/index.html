<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1A1F2E" />
  <title>SpendXP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #1A1F2E;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .center {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: #252B3B;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .wordmark { display: flex; align-items: baseline; gap: 2px; }
    .wordmark span:first-child { font-size: 28px; font-weight: 900; color: #F1F5F9; letter-spacing: -0.04em; }
    .wordmark span:last-child  { font-size: 28px; font-weight: 900; color: #4EA07A; letter-spacing: -0.04em; }
    .subtitle { font-size: 14px; color: #64748B; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(78, 160, 122, 0.2);
      border-top-color: #4EA07A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .message { font-size: 13px; color: #475569; max-width: 260px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="center">
    <div class="logo">
      <!-- Balance scales — matches the app logo -->
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
        <line x1="12" y1="3" x2="12" y2="21" stroke="#4EA07A" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="6" y1="21" x2="18" y2="21" stroke="#4EA07A" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="6" y1="9" x2="18" y2="9" stroke="#4EA07A" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M6 9 L3 15 Q6 17 9 15 Z" stroke="#4EA07A" stroke-width="1.4" stroke-linejoin="round" fill="none"/>
        <path d="M18 9 L15 15 Q18 17 21 15 Z" stroke="#4EA07A" stroke-width="1.4" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>

    <div class="wordmark">
      <span>Spend</span><span>XP</span>
    </div>

    <div class="spinner"></div>

    <p class="message">Loading SpendXP…</p>
  </div>

  <script>
    // This page is the Capacitor native shell — visible only while the remote
    // app (spendxp.vercel.app) is loading. Vercel cold-start can take 2-4s.
    // Retry after 8s in case the remote is temporarily unreachable.
    setTimeout(function () {
      if (typeof window !== 'undefined') window.location.reload();
    }, 8000);
  </script>
</body>
</html>
