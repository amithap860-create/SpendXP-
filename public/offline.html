<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1A1F2E" />
  <title>SpendXP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #1A1F2E; color: #F1F5F9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 32px; text-align: center; }
    .badge { width: 84px; height: 84px; border-radius: 24px; background: #252B3B; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 28px rgba(0,0,0,.45); }
    h1 { font-size: 26px; font-weight: 900; letter-spacing: -0.02em; }
    h1 span { color: #C8A84B; }
    p { font-size: 17px; line-height: 1.55; color: #AEB8C7; max-width: 300px; }
    button { margin-top: 8px; min-height: 52px; padding: 0 36px; border: 0; border-radius: 16px; background: #C8A84B; color: #1A1F2E; font-size: 17px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; }
    button:active { transform: scale(.97); }
    .status { font-size: 14px; color: #7B8798; min-height: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge" aria-hidden="true">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#C8A84B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 9.5a15 15 0 0 1 20 0M5.5 13a10 10 0 0 1 13 0M9 16.5a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r="1" fill="#C8A84B"/><path d="M3 3l18 18"/>
      </svg>
    </div>
    <h1>Spend<span>XP</span> is offline</h1>
    <p>We can't reach the internet right now. Your progress is safe. Check your connection and try again.</p>
    <button id="retry" type="button">Try again</button>
    <div class="status" id="status" role="status"></div>
  </div>
  <script>
    var URL_APP = 'https://spendxp.vercel.app/';
    var status = document.getElementById('status');
    function go() {
      status.textContent = 'Reconnecting…';
      window.location.href = URL_APP;
    }
    document.getElementById('retry').addEventListener('click', go);
    // Go back automatically as soon as the phone is online again.
    window.addEventListener('online', go);
  </script>
</body>
</html>
